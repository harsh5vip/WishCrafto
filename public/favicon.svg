<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a05"/>
      <stop offset="50%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>

    <!-- Diya Gold Gradient -->
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#CC5500"/>
    </linearGradient>

    <!-- Flame Glowing Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3300"/>
      <stop offset="40%" stop-color="#FF9933"/>
      <stop offset="80%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12"/>

  <!-- Tricolor Accent Dots -->
  <circle cx="90" cy="90" r="16" fill="#FF9933"/>
  <circle cx="256" cy="65" r="14" fill="#FFFFFF"/>
  <circle cx="422" cy="90" r="16" fill="#138808"/>

  <!-- Glowing Diya Flame -->
  <g filter="url(#glowEffect)">
    <!-- Outer Flame Aura -->
    <path d="M256,100 C290,170 320,220 256,290 C192,220 222,170 256,100 Z" fill="url(#flameGrad)"/>
    <!-- Inner Flame Core -->
    <path d="M256,150 C276,190 290,225 256,275 C222,225 236,190 256,150 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Sacred Festival Diya Body -->
  <path d="M120,290 C120,380 190,410 256,410 C322,410 392,380 392,290 C330,320 290,325 256,325 C222,325 182,320 120,290 Z" fill="url(#diyaGrad)" stroke="#FFD700" stroke-width="6"/>

  <!-- Diya Stand Base -->
  <path d="M206,410 C206,440 220,450 256,450 C292,450 306,440 306,410 Z" fill="#FF9933"/>

  <!-- Sparkle Stars -->
  <!-- Top Left Sparkle -->
  <path d="M140,160 L146,174 L160,180 L146,186 L140,200 L134,186 L120,180 L134,174 Z" fill="#FFD700"/>
  <!-- Top Right Sparkle -->
  <path d="M370,160 L376,174 L390,180 L376,186 L370,200 L364,186 L350,180 L364,174 Z" fill="#FFD700"/>
</svg>